[package]
authors = ["Tracel Technologies Inc."]
categories = ["command-line-interface", "command-line-utilities", "development-tools"]
description = "Utility functions for xtask-tracel crates."
edition.workspace = true
keywords = ["xtask", "utility", "dotenv", "loader"]
license.workspace = true
name = "tracel-xtask-utils"
readme.workspace = true
repository = "https://github.com/tracel-ai/xtask/tree/main/crates/tracel-xtask-utils"
rust-version = "1.85"
version.workspace = true

[features]
default = []
# all modules
all = [
  "aws",
  "cargo",
  "cleanup",
  "clap",
  "environment",
  "gcp",
  "git",
  "helpers",
  "logging",
  "process",
  "prompt",
  "rustup",
  "spinner",
  "terraform",
  "time",
  "workspace",
]

aws = [
  "aws-asg-instance-picker",
  "aws-cli",
  "aws-ec2-tag-instance-picker",
  "aws-images",
  "aws-instance-logs",
  "aws-instance-system-log",
  "aws-naming",
  "aws-regions",
]
aws-asg-instance-picker = [
  "aws-cli",
  "dep:inquire",
  "dep:owo-colors",
  "dep:serde",
  "dep:time",
]
aws-cli = ["process", "dep:serde_json"]
aws-ec2-tag-instance-picker = [
  "process",
  "dep:inquire",
  "dep:owo-colors",
  "dep:serde",
  "dep:serde_json",
  "dep:time",
]
aws-images = ["process", "spinner", "dep:serde", "dep:serde_json"]
aws-instance-logs = ["aws-cli", "dep:serde"]
aws-instance-system-log = ["aws-cli", "dep:serde"]
aws-naming = ["aws-regions", "environment"]
aws-regions = ["dep:strum"]
cargo = ["process"]
clap = ["dep:clap"]
cleanup = ["logging", "dep:ctrlc"]
environment = [
  "git",
  "logging",
  "dep:anyhow",
  "dep:dotenvy",
  "dep:strum",
]
gcp = [
  "gcp-cli",
  "gcp-naming",
  "gcp-regions",
]
gcp-cli = [
  "clap",
  "process",
  "dep:serde",
  "dep:serde_json",
]
gcp-naming = ["environment", "gcp-regions"]
gcp-regions = ["dep:strum"]
git = ["dep:anyhow"]
helpers = ["process"]
logging = ["dep:log", "dep:env_logger"]
process = [
  "logging",
  "dep:anyhow",
  "dep:rand",
  "dep:regex",
]
prompt = []
rustup = ["process"]
spinner = []
terraform = [
  "environment",
  "process",
  "dep:home",
  "dep:serde",
  "dep:toml",
  "dep:ureq",
  "dep:zip",
]
time = []
workspace = ["dep:serde_json"]

[dependencies]
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
ctrlc = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
env_logger = { workspace = true, optional = true }
home = { workspace = true, optional = true }
inquire = { workspace = true, optional = true }
log = { workspace = true, optional = true }
owo-colors = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
strum = { workspace = true, optional = true }
time = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
zip = { workspace = true, optional = true }

[dev-dependencies]
rstest = { workspace = true }
serial_test = { workspace = true }
