[package]
authors = ["Tracel Technologies Inc."]
categories = ["command-line-interface", "command-line-utilities", "development-tools", "development-tools::cargo-plugins"]
description = "Macros for tracel-xtask crate."
keywords = ["xtask", "macros"]
edition.workspace = true
license.workspace = true
name = "tracel-xtask-macros"
readme = "README.md"
repository = "https://github.com/tracel-ai/xtask/tree/main/crates/tracel-xtask-macros"
version.workspace = true
rust-version = "1.85"

[lib]
proc-macro = true

[features]
default = []
all = [
    "aws-container",
    "aws-secrets",
    "build",
    "bump",
    "check",
    "clean",
    "compile",
    "coverage",
    "dependencies",
    "doc",
    "docker-compose",
    "fix",
    "gcp-container",
    "gcp-secrets",
    "host",
    "icons",
    "image",
    "infra",
    "publish",
    "test",
    "validate",
    "vulnerabilities",
]
aws-container = []
aws-secrets = []
build = []
bump = []
check = []
clean = []
compile = []
coverage = []
dependencies = []
doc = []
docker-compose = []
fix = []
gcp-container = []
gcp-secrets = []
host = []
icons = []
image = []
infra = []
publish = []
test = []
validate = []
vulnerabilities = []

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
